<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#6366f1">
  <title>我的收藏中心</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>

  <!-- 密码门 -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="auth-title">我的收藏中心</h1>
      <p class="auth-subtitle">请输入访问密码</p>
      <div class="auth-input-wrap">
        <input type="password" id="auth-password" class="auth-input" placeholder="输入密码..." autocomplete="off" />
        <button id="auth-submit" class="auth-btn">进入</button>
      </div>
      <p id="auth-error" class="auth-error" style="display:none;">密码错误，请重新输入</p>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app" class="app" style="display:none;">

    <!-- 顶部导航栏 -->
    <header class="app-header">
      <div class="header-left">
        <button id="menu-toggle" class="icon-btn" aria-label="菜单">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <a href="#/" class="app-logo" id="logo-link">我的收藏中心</a>
      </div>
      <div class="header-right">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" placeholder="搜索收藏..." />
        </div>
        <button id="view-toggle" class="icon-btn" aria-label="切换视图" title="切换视图">
          <svg id="view-icon-grid" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 侧边分类栏 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-content">
        <div class="sidebar-section">
          <button class="sidebar-item active" data-category="all">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span>全部收藏</span>
            <span class="sidebar-count" id="count-all">0</span>
          </button>
        </div>
        <div id="category-tree" class="sidebar-section">
          <!-- 分类树由JS动态生成 -->
        </div>
        <div class="sidebar-section">
          <button class="sidebar-item sidebar-trash" id="trash-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span>回收站</span>
            <span class="sidebar-count" id="trash-count">0</span>
          </button>
        </div>
      </div>
      <div class="sidebar-footer">
        <button id="sidebar-close" class="icon-btn sidebar-close-btn" aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay" style="display:none;"></div>

    <!-- 主内容区 -->
    <main id="main-content" class="main-content">

      <!-- 首页视图 -->
      <div id="home-view" class="view">
        <!-- 当前筛选信息 -->
        <div class="filter-bar">
          <div class="filter-info">
            <span id="current-filter" class="current-filter">全部收藏</span>
            <span id="result-count" class="result-count">0 条</span>
          </div>
          <div class="filter-tags" id="active-filters"></div>
        </div>

        <!-- 内容网格 -->
        <div id="content-grid" class="content-grid">
          <!-- 卡片由JS动态生成 -->
        </div>

        <!-- 空状态 -->
        <div id="empty-state" class="empty-state" style="display:none;">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <p>暂无收藏内容</p>
          <p class="empty-hint">把你想收藏的链接发给助手，内容会出现在这里</p>
        </div>
      </div>

      <!-- 详情视图 -->
      <div id="detail-view" class="view" style="display:none;">
        <!-- 详情内容由JS动态生成 -->
      </div>

    </main>
  </div>

  <!-- 图片灯箱 -->
  <div id="lightbox" class="lightbox" style="display:none;">
    <button class="lightbox-close" aria-label="关闭">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <button class="lightbox-prev" aria-label="上一张">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <img id="lightbox-img" src="" alt="" />
    <button class="lightbox-next" aria-label="下一张">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
    <p id="lightbox-caption" class="lightbox-caption"></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
